<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SatyaVerify AI</title>

<link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
    <div class="logo">🇮🇳 SatyaVerify AI</div>

    <select id="language">
        <option value="en">English</option>
        <option value="hi">हिन्दी</option>
    </select>
</header>

<section class="hero">
    <h1 id="title">AI Document Verification Portal</h1>

    <p id="desc">
        Detect forged documents using AI-powered verification system.
    </p>

    <button class="upload-btn">
        Upload Document
    </button>
</section>

<section class="steps">

    <div class="card">
        <img src="images/step1.png">
        <h3>Step 1</h3>
        <p>Upload Document</p>
    </div>

    <div class="card">
        <img src="images/step2.png">
        <h3>Step 2</h3>
        <p>AI Verification</p>
    </div>

    <div class="card">
        <img src="images/step3.png">
        <h3>Step 3</h3>
        <p>Download Report</p>
    </div>

</section>

<!-- CHATBOT ICON -->
<div class="chatbot">
    <img src="images/chatbot.png" width="60">
    <button id="chatBtn">Need Help?</button>
</div>

<!-- CHATBOT WINDOW -->
<div class="chat-window">

    <div class="messages">
        <div class="bot-message">
            Namaste 🙏<br>
            I am Satya AI Assistant.<br>
            How can I help you?
        </div>
    </div>

    <input type="text" id="userInput" placeholder="Ask your question...">

    <button id="sendBtn">Send</button>

</div>

<script src="script.js"></script>

</body>
</html>cd backend
